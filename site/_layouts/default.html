<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.url == '/' %}{{ page.title | escape }} · {% endunless %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <nav aria-label="Main navigation">{% for item in site.navigation %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>{% endfor %}</nav>
</header>
<div class="shell">
  <aside class="profile" aria-label="Profile">
    <img class="portrait" src="{{ '/wp-content/uploads/2022/02/head-scaled.jpg' | relative_url }}" alt="Joseph Lemaitre" width="190" height="190">
    <p class="profile-name">Joseph Lemaitre</p>
    <p>Assistant Professor<br>UNC Chapel Hill</p>
    <p>Infectious disease dynamics</p>
    <div class="profile-links">
      <a href="https://scholar.google.com/citations?user=6MY9J5IAAAAJ&amp;hl=en">Google Scholar</a>
      <a href="https://github.com/jcblemai">GitHub</a>
      <a href="mailto:jo.lemaitresamra@gmail.com">Email</a>
    </div>
  </aside>
  <main id="main">{{ content }}</main>
</div>
<footer class="site-footer"><span>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</span></footer>
</body>
</html>
