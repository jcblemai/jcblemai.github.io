title: Joseph Lemaitre
description: Researcher in infectious disease dynamics. Models, methods, and notes.
url: https://josephlemaitre.com
baseurl: ""
source: site
destination: dist
encoding: utf-8
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:title/
strict_front_matter: true
future: false
show_drafts: false
unpublished: false
# Keep post sources and categories, but omit both sections from the public build.
exclude: [draft, private, vendor, node_modules, _posts, pages/posts.md, pages/atomic-posts.md]
plugins:
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      layout: page
navigation:
  - title: About
    url: /
